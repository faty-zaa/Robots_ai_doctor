
[project]
name = "robodoctor"
version = "0.1.0"
description = "RAG-powered robotics troubleshooting assistant"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "ollama",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
